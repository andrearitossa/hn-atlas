<style>
:root { --bg:#fbfbfa; --ink:#18181b; --muted:#71717a; --line:#e7e7e4; --hn:#f56300; --dot:#a1a1aa; --cool:#3b82f6; }
@media(prefers-color-scheme:dark) { :root { --bg:#111113; --ink:#ececef; --muted:#a1a1aa; --line:#303036; --dot:#686872; --cool:#60a5fa; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,sans-serif; }
a { color:inherit; text-decoration:none; }
button,input,select { font:inherit; color:inherit; }
button,a,input,select { -webkit-tap-highlight-color:transparent; }
:focus-visible { outline:2px solid var(--hn); outline-offset:3px; }
button { cursor:pointer; }
header { display:flex; flex-shrink:0; align-items:center; justify-content:space-between; gap:24px; padding:12px clamp(16px,4vw,56px); border-bottom:1px solid var(--line); }
header b { font-size:17px; } header b span { color:var(--hn); }
.toggle a { color:var(--muted); padding:7px 12px; border-radius:7px; transition:background .18s,color .18s; } .toggle a.on,.toggle a[aria-current="page"] { color:var(--ink); background:var(--bg); box-shadow:0 1px 3px #0000000c; }
main { flex:1; min-height:0; overflow-y:auto; }
.home { height:100%; overflow-y:auto; }
.home-inner { max-width:1300px; margin:auto; padding:34px clamp(20px,4vw,56px) 60px; }
.directory-intro { margin:12px 0 30px; }
.eyebrow { color:var(--hn); text-transform:uppercase; letter-spacing:.13em; font-size:11px; font-weight:750; }
.directory-intro h1 { font-size:clamp(30px,4vw,48px); line-height:1.12; letter-spacing:-.05em; margin:8px 0 14px; }
.directory-intro h1 span { color:var(--hn); }

.browse-tools { display:flex; gap:12px; flex-wrap:wrap; }
.browse-tools input { flex:1; min-width:240px; border:1px solid var(--line); border-radius:10px; padding:13px 15px; background:var(--bg); }
.browse-tools select,.browse-tools>button,#more-stories { border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--bg); color:inherit; }
.sort { display:flex; align-items:center; gap:3px; border:1px solid var(--line); border-radius:10px; padding:4px; }
.sort button { background:none; border:0; border-radius:7px; padding:7px 11px; color:var(--muted); white-space:nowrap; }
.sort button.on { background:var(--ink); color:var(--bg); }
.directory-summary { margin-top:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; }
.directory-summary a { color:var(--hn); padding:8px 0; }
.directory-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.topic-card { display:flex; flex-direction:column; min-height:170px; padding:20px 6px; border-top:1px solid var(--line); transition:border-color .24s,background .24s; }
.topic-card:hover { border-color:color-mix(in srgb,var(--hn) 50%,var(--line)); background:color-mix(in srgb,var(--bg) 97%,var(--hn)); }
.topic-card strong { font-size:17px; line-height:1.25; }
.topic-card:hover strong { color:var(--hn); }
.topic-card p { color:var(--muted); font-size:13px; margin:9px 0 16px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-kicker { display:flex; justify-content:space-between; gap:8px; margin-top:auto; font-size:11px; color:var(--muted); }
.card-kicker small { font-size:inherit; }
.more { background:none; border:1px solid var(--line); border-radius:20px; display:block; margin:24px auto 0; padding:10px 24px; }
.empty { grid-column:1/-1; padding:40px; text-align:center; color:var(--muted); }
 .toggle { display:flex; gap:2px; padding:3px; border-radius:10px; background:color-mix(in srgb,var(--ink) 5%,var(--bg)); font-size:13px; }
.connections-page { position:relative; height:100%; display:flex; flex-direction:column; padding:34px clamp(20px,4vw,56px) 40px; max-width:1300px; margin:auto; }
.connections-heading { display:flex; justify-content:space-between; align-items:center; gap:24px; margin:12px 0 24px; }
.connections-heading h1 { margin:0 0 10px; font-size:clamp(30px,4vw,48px); letter-spacing:-.05em; line-height:1.12; }
.connections-heading h1 span { color:var(--hn); }
.connections-heading input { width:280px; max-width:100%; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:13px 15px; }
.connections-canvas { position:relative; flex:1; min-width:0; min-height:320px; border-radius:18px; overflow:hidden; background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--hn) 3%,var(--bg)),var(--bg) 70%); box-shadow:inset 0 0 0 1px var(--line); }
.connections-layout { display:flex; flex:1; min-height:0; gap:14px; }
.connections-canvas #map { position:absolute; inset:0; }
.map-legend { position:absolute; top:16px; left:18px; display:flex; align-items:center; flex-wrap:wrap; gap:3px 7px; max-width:calc(100% - 36px); padding:3px 5px; color:var(--muted); background:var(--bg); font-size:11px; pointer-events:none; z-index:1; }
.legend-dot { width:8px; height:8px; flex:none; border-radius:50%; background:hsl(137.508 42% 35%); }
.map-results { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12px; }
.map-results:not(:empty) { margin-bottom:14px; }
.map-results>span { color:var(--muted); }
.map-results button { background:none; color:inherit; cursor:pointer; border:1px solid var(--line); border-radius:20px; padding:6px 10px; }
.map-results button:hover { color:var(--hn); border-color:var(--hn); }
svg { display:block; width:100%; height:100%; }
#map { touch-action:none; cursor:grab; }
.map-help { position:absolute; left:18px; bottom:18px; font-size:11px; color:var(--muted); pointer-events:none; }
.map-controls { position:absolute; right:16px; bottom:16px; display:flex; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--bg); box-shadow:0 2px 8px #00000006; }
.map-controls button { border:0; border-right:1px solid var(--line); border-radius:0; background:var(--bg); min-width:40px; height:40px; padding:0 12px; }
.map-controls button:last-child { border-right:0; }
.map-controls button:focus-visible { outline-offset:-3px; }
.map-controls button:disabled { opacity:.35; cursor:default; }
.map-controls button:hover { color:var(--hn); border-color:var(--hn); }
.topic-dot { stroke:var(--bg); stroke-width:1.5; cursor:pointer; transition:opacity .2s, r .2s; }
.topic-dot:hover,.topic-dot:focus { stroke:var(--ink); stroke-width:2; }
.dim { opacity:.08; }
line { stroke:var(--line); }
text { fill:var(--ink); font-size:12px; }
#map text { pointer-events:none; paint-order:stroke; stroke:var(--bg); stroke-width:3px; font-size:11px; font-weight:550; }
.map-edge { fill:none; transition:stroke-opacity .2s; }
#tip { position:fixed; pointer-events:none; background:var(--ink); color:var(--bg); padding:8px 10px; border-radius:6px; max-width:300px; font-size:12px; }
.page { max-width:1200px; height:100%; margin:auto; padding:24px 32px 48px; overflow-y:auto; }
.hero { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-top:18px; }
.page h1 { font-size:30px; line-height:1.15; margin:0 0 12px; letter-spacing:-.03em; }
.meta { color:var(--muted); margin:0; }
small { color:var(--muted); }
.up { color:var(--hn); } .down { color:var(--cool); }
.topic-follow-panel { border:1px solid var(--line); background:color-mix(in srgb,var(--bg) 94%,var(--hn)); border-radius:14px; padding:18px; min-width:280px; max-width:360px; }
.topic-follow-panel strong { display:block; font-size:16px; }
.topic-follow-panel p { margin:4px 0 12px; color:var(--muted); }
.topic-follow-panel form { display:flex; gap:6px; flex-wrap:wrap; }
.topic-follow-panel input,.topic-follow-panel select,.topic-follow-panel button { border:1px solid var(--line); border-radius:7px; padding:8px; background:var(--bg); }
.topic-follow-panel input { width:100%; min-width:0; }
.topic-follow-panel button { background:var(--hn); color:white; }
.topic-nav .topic-follow-link { margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; }
.topic-nav .topic-follow-link:hover { color:var(--hn); }
.topic-follow { margin:0 0 44px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); scroll-margin-top:90px; }
.topic-follow summary { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:20px 0; cursor:pointer; list-style:none; }
.topic-follow summary::-webkit-details-marker { display:none; }
.topic-follow summary strong { display:block; font-size:16px; }
.topic-follow summary small { display:block; margin-top:3px; }
.topic-follow-action { color:var(--hn); font-size:13px; white-space:nowrap; }
.topic-follow-action span { display:inline-block; margin-left:8px; }
.topic-follow[open] .topic-follow-action span { transform:rotate(45deg); }
.topic-follow .topic-follow-panel { max-width:560px; min-width:0; border:0; border-radius:0; background:none; padding:0 0 22px; }
.topic-follow .topic-follow-panel form { flex-wrap:nowrap; margin:14px 0 10px; }
.topic-follow .topic-follow-panel input[type="email"] { flex:1; width:auto; }
.topic-follow .topic-follow-panel button { white-space:nowrap; padding:9px 14px; }
@media(max-width:600px) { .page .topic-nav { display:grid; grid-template-columns:repeat(4,1fr); gap:6px 10px; } .page .topic-nav .topic-follow-link { grid-column:1/-1; justify-self:end; } .topic-follow summary { align-items:start; flex-direction:column; gap:12px; } .topic-follow .topic-follow-panel form { flex-wrap:wrap; } .topic-follow .topic-follow-panel input[type="email"] { flex-basis:100%; } }
.topic-follow-panel button:disabled { opacity:.6; cursor:wait; }
.contact-check { position:absolute; left:-10000px; }
.topic-follow-panel a { color:var(--hn); }
#follow-status { display:block; margin-top:10px; overflow-wrap:anywhere; }
#follow-status div { padding:5px 0; border-top:1px solid var(--line); }
.related { display:flex; flex-wrap:wrap; gap:6px; font-size:13px; margin:20px 0; }
.related a:hover { color:var(--hn); }
.activity { border:1px solid var(--line); border-radius:14px; padding:18px; margin:20px 0 28px; }
.chart-heading { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; align-items:center; }
.chart-heading h2 { margin:0; font-size:16px; }
#chart-readout { color:var(--muted); margin:3px 0 12px; font-size:13px; }
#activity-chart { height:210px; }
.activity rect { fill:var(--hn); opacity:.45; cursor:pointer; }
.activity rect.selected { opacity:1; }
.activity text { fill:var(--muted); font-size:11px; }
.chart-note { font-size:11px; color:var(--muted); margin:4px 0 0; }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:32px; }
h3 { text-transform:uppercase; letter-spacing:.05em; font-size:12px; color:var(--muted); }
.post { padding:12px 0; border-top:1px solid var(--line); }
.post a:hover { color:var(--hn); }
.post small { display:block; margin-top:4px; font-size:11px; }
.loading { color:var(--muted); padding:30px; }
@media(max-width:900px) { .directory-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:600px) { body { height:auto; } .home,.page { height:auto; overflow:visible; } .home-inner,.page { padding:20px 16px 40px; } .directory-grid { grid-template-columns:1fr; } .topic-card { min-height:145px; } .hero { flex-direction:column; } .topic-follow-panel { width:100%; max-width:none; } .cols { grid-template-columns:1fr; gap:14px; }  .connections-page { height:auto; min-height:calc(100dvh - 56px); padding:20px 16px; } .connections-heading { flex-direction:column; align-items:stretch; gap:16px; } .connections-heading h1 { font-size:30px; } .connections-heading input { width:100%; } .connections-canvas { min-height:440px; } .toggle { gap:14px; font-size:12px; } .activity { padding:12px; } #activity-chart { height:170px; } .card-kicker { font-size:12px; } }

.map-preview { position:relative; flex-shrink:0; overflow-y:auto; width:300px; padding:20px; border:1px solid var(--line); border-radius:14px; background:var(--bg); color:var(--ink); }
.map-preview .eyebrow { color:var(--hn); margin:0 0 8px; }
.map-preview h2 { font-size:20px; line-height:1.2; letter-spacing:-.03em; margin:0 16px 9px 0; }
.map-preview>p:not(.eyebrow) { font-size:12px; color:var(--muted); margin:0 0 13px; }
.preview-close { position:absolute; top:10px; right:10px; border:0; background:none; color:var(--muted); font-size:22px; }
.preview-stats { color:var(--muted); font-size:11px; }
.preview-open { display:flex; justify-content:space-between; margin:16px 0 10px; padding:10px 12px; border-radius:8px; color:var(--bg); background:var(--ink); font-weight:650; }
.preview-related { display:flex; flex-direction:column; gap:2px; }
.preview-related button { background:none; border:0; text-align:left; color:var(--muted); font-size:11px; padding:6px 0; }
.preview-related button:hover,.preview-open:hover { color:var(--hn); }
@media(max-width:600px) { .map-preview { position:static; width:100%; padding:18px; margin-top:12px; overflow:visible; } .map-legend { left:12px; max-width:calc(100% - 24px); font-size:9px; gap:3px 5px; } .connections-canvas .map-help { font-size:9px; bottom:60px; } }

.map-result-options { display:flex; flex-wrap:wrap; gap:6px; max-height:112px; overflow-y:auto; width:100%; }
.map-result-options button { text-align:left; }
.preview-stories { border-top:1px solid var(--line); padding-top:4px; }
.map-preview h3 { color:var(--muted); font-size:10px; margin:14px 0 7px; }
.preview-stories a { display:block; font-size:12px; color:var(--ink); padding:7px 0; border-bottom:1px solid var(--line); }
.preview-stories a:hover { color:var(--hn); }
.preview-stories p,.preview-related p { font-size:12px; color:var(--muted); }
@media(max-width:600px) { .connections-layout { display:block; } .connections-canvas { min-height:360px; height:360px; flex:none; } .map-preview { position:relative; } }


.topic-history { margin:20px 0 36px; padding:26px; border:1px solid var(--line); border-radius:16px; background:var(--bg); }
.history-heading { display:flex; justify-content:space-between; align-items:center; gap:20px; }
.history-heading h2 { font-size:28px; letter-spacing:-.035em; margin:0; }
.history-heading p { margin:6px 0; }
.history-span { font-size:23px; white-space:nowrap; letter-spacing:-.04em; }
.history-span small { display:block; font-size:11px; color:var(--muted); letter-spacing:0; text-align:right; }
.history-years { display:flex; overflow-x:auto; gap:8px; padding:16px 2px; margin-top:12px; border-bottom:1px solid var(--line); }

.history-year-title { display:flex; align-items:center; gap:18px; margin:22px 0 16px; }

.history-picks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
.history-pick { border-top:3px solid var(--hn); padding:16px 14px; background:color-mix(in srgb,var(--line) 25%,var(--bg)); border-radius:0 0 10px 10px; display:flex; flex-direction:column; }
.history-pick .eyebrow { font-size:9px; margin:0 0 16px; }
.history-pick time { font-size:12px; color:var(--muted); }
.history-pick h4 { font-size:18px; line-height:1.4; letter-spacing:-.02em; margin:8px 0; overflow-wrap:anywhere; }
.history-pick h4 a:hover { color:var(--hn); }
.history-pick .meta { font-size:11px; overflow-wrap:anywhere; }
.history-discussion { font-size:11px; margin-top:auto; padding-top:12px; color:var(--muted); }
.history-navigation { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:22px 0; }
.history-navigation button,#history-retry { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
.history-navigation button:disabled { opacity:.4; cursor:default; }

@media(max-width:700px) { .topic-history { padding:18px; } .history-picks { grid-template-columns:1fr; } .history-heading { align-items:start; flex-direction:column; gap:10px; } .history-span small { text-align:left; } .history-navigation { flex-wrap:wrap; } .history-year-title { align-items:start; flex-direction:column; gap:2px; } }

/* A reading path: orientation, history, current stories, then the archive. */
.page { max-width:1100px; padding-top:28px; }
.topic-hero { margin:24px 0 16px; }

.topic-stats { color:var(--muted); font-size:11px; display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
.topic-nav { position:sticky; top:0; z-index:3; background:var(--bg); display:flex; gap:28px; border-bottom:1px solid var(--line); padding:16px 0; margin-bottom:24px; }
.topic-nav button { border:0; padding:6px 0; background:none; color:var(--hn); font-size:10px; letter-spacing:.04em; }

#topic-history,#topic-recent,#topic-activity,#topic-archive { scroll-margin-top:82px; }
.topic-history { border:0; padding:8px 0 30px; border-bottom:1px solid var(--line); border-radius:0; margin:0 0 40px; }

.history-span { font-size:17px; }
.history-heading { margin-bottom:12px; }
.history-years { border-bottom:0; padding:16px 2px 0; margin-top:6px; }

#explore-year { border:0; background:none; color:var(--muted); font-size:12px; padding:8px 0; text-align:left; }

.history-pick { padding:20px; border-top-width:2px; border-radius:0 0 12px 12px; }

.section-intro { color:var(--muted); margin:8px 0 22px; }

.post small { line-height:1.8; }

#archive-context { font-size:12px; margin:10px 0 18px; }
#story-results .post { padding:16px 0; }
#more-stories { margin:16px 0; width:100%; }
#story-status { font-size:12px; margin-top:12px; }
.activity { margin:28px 0; padding:20px 22px; border:1px solid var(--line); border-radius:16px; background:color-mix(in srgb, var(--hn) 3%, var(--bg)); }
.activity>summary { padding:18px 0; color:var(--muted); font-size:13px; cursor:pointer; }

@media(max-width:600px) { .activity { padding:16px 10px; } }

.related-cards a { border:1px solid var(--line); border-radius:12px; padding:20px; }

<body>
<header>
  <a href="/"><b>HN <span>Atlas</span></b></a>
  <nav class="toggle" aria-label="Explore"><a id="connections" href="/">Connections</a><a id="trends" href="/#/trends">Trends</a><a id="topics" href="/#/topics">Topics</a></nav>
</header>
<main id="app"></main>
<footer class="site-footer" hidden>
  <span>Built by Andrea Ritossa</span>
  <a href="/#/trends">Trends</a>
  <button type="button" id="feedback-open">Feedback</button>
</footer>
<dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-title" aria-describedby="feedback-intro">
  <div class="feedback-heading"><h2 id="feedback-title">Help shape Hacker Atlas</h2><button type="button" class="feedback-close" id="feedback-close" aria-label="Close feedback">×</button></div>
  <p id="feedback-intro">Useful, confusing, or missing something? I’d love to hear.</p>
  <form id="feedback-form">
    <label for="feedback-message">Your feedback</label>
    <textarea id="feedback-message" name="message" maxlength="2000" placeholder="What’s on your mind?" required autofocus></textarea>
    <label for="feedback-email">Email <span class="meta">(optional, for a reply)</span></label>
    <input id="feedback-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com">
    <label class="contact-check" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
    <small>Your feedback is private. Your email is only used to reply, never to sign you up for a newsletter.</small>
    <button class="feedback-send" type="submit">Send feedback</button>
  </form>
  <p id="feedback-status" role="status" aria-live="polite"></p>
</dialog>

<div id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="./data.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const hn = id => `https://news.ycombinator.com/item?id=${id}`;
const safeUrl = u => { try { const x = new URL(u); return ["http:", "https:"].includes(x.protocol) ? x.href : ""; } catch { return ""; } };
const domain = u => { const x = safeUrl(u); return x ? new URL(x).hostname.replace(/^www\./, "") : ""; };
let T, routeVersion = 0;
const browseState = {query: "", sort: "active"};
let activityResizeObserver, mapResizeObserver;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
// Whole words and prefixes; short terms such as AI must match exactly.
const searchWords = value => (value.normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase()
  .replace(/artificial intelligence/g, "ai").replace(/machine learning/g, "ml")
  .match(/[\p{L}\p{N}+#]+/gu) || []).map(word => ({js:"javascript",ts:"typescript"}[word] || word));
const matchingTopics = query => {
  const words = [...new Set(searchWords(query))];
  if (!words.length) return [...T.topics];
  const score = topic => {
    const title = searchWords(topic.name), description = searchWords(topic.description || "");
    let total = 0;
    for (const word of words) {
      const prefix = term => word.length >= 3 && term.startsWith(word);
      const weight = title.includes(word) ? 8 : title.some(prefix) ? 5
        : description.includes(word) ? 2 : description.some(prefix) ? 1 : 0;
      if (!weight) return 0;
      total += weight;
    }
    return total + (title.join(" ") === words.join(" ") ? 20 : 0);
  };
  return T.topics.map(topic => ({topic, score:score(topic)})).filter(item => item.score > 0)
    .sort((a,b) => b.score-a.score || b.topic.last_7d-a.topic.last_7d || a.topic.name.localeCompare(b.topic.name))
    .map(item => item.topic);
};
const details = new Map();
function topicDetails(id) {
  id=Number(id);
  if (!details.has(id)) details.set(id,data.topic(id).catch(error=>{details.delete(id);throw error;}));
  return details.get(id);
}

const topicCard = t => `<a class="topic-card" href="/topic/${t.slug}/"><strong>${esc(t.name)}</strong><p>${esc(t.description)}</p><div class="card-kicker"><span>${t.last_7d.toLocaleString()} posts · past 7 days</span></div></a>`;

async function home(version, host) {
  T ??= await data.topics();
  if (version !== routeVersion) return;
  if (!host.querySelector(".home")) host.innerHTML = `<div class="home"><div class="home-inner">
    <div class="directory-intro"><h2>Browse topics</h2><p class="meta">Find your next rabbit hole.</p></div>
    <section class="directory-section" aria-label="Topic directory"><div class="browse-tools"><input id="q" type="search" placeholder="Search topics" aria-label="Search topics" autocomplete="off" value="${esc(browseState.query)}"><div class="sort" aria-label="Sort topics"><button data-sort="relevance" hidden>Best match</button><button data-sort="active">Most active</button><button data-sort="az">A–Z</button></div></div>
    <div class="directory-summary"><p id="result-count" role="status"></p><p class="meta">Stories through ${new Date(T.as_of * 1000).toLocaleDateString()}</p></div>
    <div class="directory-grid" id="directory"></div></section>
  </div></div>`;
  const render = () => {
    const query = browseState.query.trim();
    const matches = matchingTopics(query);
    if (browseState.sort !== "relevance") matches.sort(browseState.sort === "az" ? (a,b) => a.name.localeCompare(b.name) : (a,b) => b.last_7d-a.last_7d);
    $("#directory").innerHTML = matches.map(topicCard).join("") || `<div class="empty"><h2>No topics found</h2><p>Try fewer words or clear your search.</p></div>`;
    $("#result-count").textContent = `${matches.length} ${matches.length === 1 ? 'topic' : 'topics'}${query ? ' found' : ''}`;
    document.querySelector('[data-sort="relevance"]').hidden = !query;
    document.querySelectorAll("[data-sort]").forEach(b => { b.classList.toggle("on",b.dataset.sort === browseState.sort); b.setAttribute("aria-pressed",b.dataset.sort === browseState.sort); });
  };
  const search = value => { browseState.query=value; browseState.sort=value.trim() ? "relevance" : "active"; $("#q").value=value; render(); };
  $("#q").oninput = e => search(e.target.value);
  $("#q").onkeydown = e => { if (e.key === "Escape") search(""); };
  document.querySelectorAll("[data-sort]").forEach(b => b.onclick=()=>{browseState.sort=b.dataset.sort; render();});
  if (host.dataset.prerendered) delete host.dataset.prerendered; else render();
}

async function connections(version) {
  T ??= await data.topics();
  if (version !== routeVersion) return;
  document.body.classList.remove('home-route');
  document.body.classList.add('connections-route');
  if (!$(".connections-page")) $("#app").innerHTML=`<section class="connections-page">
    <div class="connections-explorer" id="map-section"><div class="connections-heading"><div><h1>Explore the connections</h1><p class="meta">Follow a topic. See where it leads.</p></div><input id="map-search" type="search" placeholder="Find a topic…" aria-label="Find a topic on the map" autocomplete="off"></div>
    <div id="map-results" class="map-results" aria-live="polite"></div>
    <div class="connections-layout"><div class="connections-canvas"><svg id="map" tabindex="0" role="group" aria-label="Interactive topic connections. Use plus and minus to zoom, or drag to pan."></svg><div class="map-legend"><span class="legend-dot"></span><span>Color identifies topic · Size shows story volume · Lines connect related topics</span></div><span class="map-help">Drag to explore · Zoom for more names</span><div class="map-controls"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset" aria-label="Reset zoom">Reset</button></div></div><aside id="map-preview" class="map-preview" hidden aria-live="polite"></aside></div></div>
    <section id="trends-section" aria-label="Topic trends"><div id="trends-mount"></div></section>
    <section id="browse-section" aria-label="Browse topics"></section>
  </section>`;
  const trendsMount=$('#trends-mount');
  if (trendsMount && !trendsMount.hasChildNodes()) trendsMount.innerHTML='<p class="trends-fallback">Topic trends are available on the <a href="/analytics/">Trends page</a>.</p>';
  await home(version, $('#browse-section'));
  if (version !== routeVersion) return;
  if (!window.d3) { $(".connections-canvas").innerHTML='<p class="loading">The map could not load. <a href="/#/topics">Browse topics →</a></p>'; return; }
  const map=drawMap();
  const results=$("#map-results");
  $("#map-search").oninput=e=>{
    const q=e.target.value.trim(), matches=matchingTopics(q);
    map.filter(new Set(matches.map(t=>t.id)));
    results.innerHTML=q ? `<span>${matches.length} matching topics · select to explore</span><div class="map-result-options">`+matches.map(t=>`<button data-result="${t.id}">${esc(t.name)}</button>`).join("")+`</div>`+(matches.length ? "" : "<span>Try fewer words or a broader subject.</span>") : "";
  };
  results.onclick=e=>{const button=e.target.closest("[data-result]");if(button)map.select(Number(button.dataset.result));};
  $(".connections-page").onkeydown=e=>{if(e.key==="Escape"){map.clear();$("#map-search").focus();}};

}

function drawMap() {
  const svg=d3.select("#map"), layer=svg.append("g");
  const rect=svg.node().getBoundingClientRect();
  let mapWidth=rect.width || 1000, mapHeight=rect.height || 620;
  svg.attr('viewBox',`0 0 ${mapWidth} ${mapHeight}`);
  const x=d3.scaleLinear([0,1],[36,mapWidth-36]), y=d3.scaleLinear([0,1],[64,mapHeight-80]);
  const radius=d3.scaleSqrt([0,d3.max(T.topics,t=>t.size)],[2.5,Math.min(12,Math.max(6,mapWidth/80))]);
  // The same stable topic color is used in the trends treemap.
  const color=t=>`hsl(${(Number(t.id)*137.508)%360} 42% 35%)`;
  const byId=new Map(T.topics.map(t=>[t.id,t]));
  const edges=T.edges.filter(e=>byId.has(e.a)&&byId.has(e.b));
  const neighbors=new Map(T.topics.map(t=>[t.id,new Set([t.id])]));
  edges.forEach(e=>{neighbors.get(e.a).add(e.b);neighbors.get(e.b).add(e.a);});
  let selected=null, matching=new Set(byId.keys()), hovered=null, transform=d3.zoomIdentity;
  const edgePath=e=>{const a=byId.get(e.a),b=byId.get(e.b);return `M${x(a.x)},${y(a.y)} Q${(x(a.x)+x(b.x))/2+12},${(y(a.y)+y(b.y))/2-12} ${x(b.x)},${y(b.y)}`;};
  const paths=layer.append("g").selectAll("path").data(edges).join("path").attr("class","map-edge")
    .attr("d",edgePath);
  const dots=layer.append("g").selectAll("circle").data(T.topics).join("circle").attr("class","topic-dot")
    .attr("cx",t=>x(t.x)).attr("cy",t=>y(t.y)).attr("r",t=>radius(t.size)).attr("fill",color)
    .attr("tabindex",0).attr("role","button").attr("aria-label",t=>`Explore ${t.name}`).attr("aria-pressed","false");
  // Keep labels outside the zoomed layer so names remain a readable size.
  const labels=svg.append("g").attr("aria-hidden","true").selectAll("text").data(T.topics).join("text")
    .attr("class","map-label").attr("x",t=>x(t.x)).attr("y",t=>y(t.y)-radius(t.size)-9)
    .attr("text-anchor","middle").text(t=>t.name);
  let labelWidths=new Map(), labelHeight=12, labelFrame=0;
  const layoutLabels=()=>{
    labelFrame=0;
    if (!svg.node().isConnected) return;
    const active=selected ?? hovered, connected=active==null ? null : neighbors.get(active);
    const visible=t=>connected ? connected.has(t.id) : matching.has(t.id);
    const boxes=[], positions=new Map(), padding=labelHeight*.35;
    const nodeBoxes=T.topics.filter(visible).map(t=>{
      const [cx,cy]=transform.apply([x(t.x),y(t.y)]), r=radius(t.size)*transform.k;
      return [cx-r,cy-r,cx+r,cy+r];
    });
    const candidates=[...T.topics].filter(visible).sort((a,b)=>(b.id===active)-(a.id===active)||b.size-a.size||a.id-b.id);
    for(const t of candidates) {
      const [cx,cy]=transform.apply([x(t.x),y(t.y)]);
      if(cx<0 || cx>mapWidth || cy<0 || cy>mapHeight) continue;
      const w=labelWidths.get(t.id) || t.name.length*labelHeight*.5;
      const r=(radius(t.size)+(t.id===active ? 3 : 0))*transform.k;
      // Place each name near its node, using actual visible space at this zoom.
      const options=[
        [cx,cy-r-padding], [cx,cy+r+labelHeight],
        [cx+r+padding+w/2,cy+labelHeight*.3], [cx-r-padding-w/2,cy+labelHeight*.3]
      ];
      for(const [lx,ly] of options) {
        const box=[lx-w/2-padding,ly-labelHeight,lx+w/2+padding,ly+padding];
        if(box[0]<8 || box[2]>mapWidth-8 || box[1]<60 || box[3]>mapHeight-66) continue;
        if(boxes.some(b=>box[0]<b[2]&&box[2]>b[0]&&box[1]<b[3]&&box[3]>b[1]))continue;
        if(nodeBoxes.some(b=>box[0]<b[2]&&box[2]>b[0]&&box[1]<b[3]&&box[3]>b[1]))continue;
        boxes.push(box);positions.set(t.id,{x:lx,y:ly});break;
      }
    }
    labels.attr("opacity",t=>positions.has(t.id)?1:0)
      .attr("x",t=>positions.get(t.id)?.x ?? transform.applyX(x(t.x)))
      .attr("y",t=>positions.get(t.id)?.y ?? transform.applyY(y(t.y)))
      .style("font-weight",t=>t.id===active ? 700 : 500);
  };
  const queueLabels=()=>{if(!labelFrame)labelFrame=requestAnimationFrame(layoutLabels);};
  const measureLabels=()=>{
    const rect=svg.node().getBoundingClientRect();
    if(!rect.width || !rect.height)return;
    if(rect.width!==mapWidth || rect.height!==mapHeight) {
      const next=d3.zoomIdentity.translate(transform.x*rect.width/mapWidth,transform.y*rect.height/mapHeight).scale(transform.k);
      mapWidth=rect.width;mapHeight=rect.height;
      svg.attr('viewBox',`0 0 ${mapWidth} ${mapHeight}`);
      x.range([36,mapWidth-36]);y.range([64,mapHeight-80]);
      radius.range([2.5,Math.min(12,Math.max(6,mapWidth/80))]);
      paths.attr('d',edgePath);
      dots.attr('cx',t=>x(t.x)).attr('cy',t=>y(t.y));
      svg.call(zoom.transform,next);
    }
    labels.style('font-size',`${labelHeight}px`).style('stroke-width','3px');
    labelWidths=new Map();
    labels.each(function(t){labelWidths.set(t.id,this.getComputedTextLength());});
    queueLabels();
  };
  const refresh=()=>{
    const active=selected ?? hovered, connected=active==null ? null : neighbors.get(active);
    const visible=t=>connected ? connected.has(t.id) : matching.has(t.id);
    dots.attr("opacity",t=>visible(t) ? 1 : .13).attr("r",t=>radius(t.size)+(t.id===active ? 3 : 0))
      .attr("tabindex",t=>visible(t)?0:-1).attr("aria-pressed",t=>t.id===selected).attr("fill",color)
      .attr("stroke",t=>t.id===active ? "var(--ink)" : "var(--bg)");
    paths.attr("stroke",e=>active!=null && (e.a===active||e.b===active) ? color(byId.get(active)) : color(byId.get(e.a)))
      .attr("stroke-opacity",e=>active==null ? .18 : (e.a===active||e.b===active) ? .7 : .025)
      .attr("stroke-width",e=>active!=null && (e.a===active||e.b===active) ? 1.5 : .7);
    queueLabels();
  };
  const preview=$("#map-preview");
  const clear=()=>{selected=null;hovered=null;preview.hidden=true;refresh();};
  const select=id=>{
    const t=byId.get(id);
    if(!t)return;
    selected=id;hovered=null;
    const related=[...neighbors.get(id)].filter(other=>other!==id).map(other=>byId.get(other)).sort((a,b)=>b.last_7d-a.last_7d);
    preview.hidden=false;
    preview.innerHTML=`<button class="preview-close" aria-label="Close topic preview">×</button><p class="eyebrow">${related.length} connected topics</p><h2>${esc(t.name)}</h2><p>${esc(t.description)}</p><div class="preview-stats">${t.last_7d.toLocaleString()} posts · past 7 days</div><a class="preview-open" href="/topic/${t.slug}/">Read this topic <span>↗</span></a><div class="preview-stories" id="map-stories"></div><h3>Explore related topics</h3><div class="preview-related">${related.map(r=>`<button data-neighbor="${r.id}">${esc(r.name)} →</button>`).join("") || '<p>No connections yet.</p>'}</div>`;
    refresh();
    topicDetails(id).then(data=>{
      if(selected!==id || !preview.isConnected)return;
      preview.querySelector("#map-stories").innerHTML='<h3>Recent stories</h3>'+data.trending.slice(0,3).map(p=>`<a href="${esc(safeUrl(p.url)||hn(p.id))}" target="_blank" rel="noopener">${esc(p.title)} ↗</a>`).join("")+(data.trending.length ? "" : '<p>No featured stories yet.</p>');
    }).catch(()=>{if(selected===id && preview.isConnected)preview.querySelector("#map-stories").innerHTML='<p>Stories could not load. Open the topic to try again.</p>';});
    if(innerWidth<=600)preview.querySelector('.preview-close').focus({preventScroll:true});
  };
  preview.onclick=e=>{
    if(e.target.closest(".preview-close")){const previous=selected;clear();dots.filter(t=>t.id===previous).node()?.focus();}
    const next=e.target.closest("[data-neighbor]");if(next)select(Number(next.dataset.neighbor));
  };
  dots.on("pointerenter focus",(_,t)=>{if(selected===null){hovered=t.id;refresh();}})
    .on("pointerleave blur",()=>{hovered=null;refresh();})
    .on("click",(_,t)=>select(t.id)).on("keydown",(e,t)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(t.id);}});
  const zoom=d3.zoom().scaleExtent([1,12])
    .filter(e=>e.type==='wheel' ? e.ctrlKey || e.metaKey : !e.button)
    .on("start",()=>{hovered=null;refresh();svg.style('cursor','grabbing');})
    .on("zoom",e=>{
      transform=e.transform;
      layer.attr("transform",transform);
      $('#zoom-in').disabled=transform.k>=12;
      $('#zoom-out').disabled=transform.k<=1;
      queueLabels();
    }).on("end",()=>svg.style('cursor',null));
  svg.call(zoom).on("dblclick.zoom",null);
  const animate=()=>svg.interrupt().transition().duration(reduceMotion()?0:280).ease(d3.easeCubicOut);
  $("#zoom-in").onclick=()=>animate().call(zoom.scaleBy,1.5);
  $("#zoom-out").onclick=()=>animate().call(zoom.scaleBy,1/1.5);
  $("#zoom-reset").onclick=()=>{clear();animate().call(zoom.transform,d3.zoomIdentity);};
  $('#zoom-out').disabled=true;
  svg.on('keydown',e=>{
    if(e.target!==svg.node())return;
    const control=({'+' : '#zoom-in', '=' : '#zoom-in', '-' : '#zoom-out', '0' : '#zoom-reset'})[e.key];
    if(control){e.preventDefault();$(control).click();}
  });
  mapResizeObserver=new ResizeObserver(measureLabels);
  mapResizeObserver.observe(svg.node());
  measureLabels();
  refresh();
  return {select,clear,filter:ids=>{matching=ids;clear();}};
}

// ---------- topic page ----------
const post = p => `<div class="post"><a href="${esc(safeUrl(p.url) || hn(p.id))}" title="${esc(p.title)}" target="_blank" rel="noopener">${esc(p.title)}</a>
  <small>${safeUrl(p.url) ? `<a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">↗ ${esc(domain(p.url))}</a> · ` : ""}<a href="${hn(p.id)}" target="_blank" rel="noopener">HN · ${p.descendants ?? 0} comments</a> · ${p.score} points · ${new Date(p.time * 1000).toLocaleDateString()}</small></div>`;

async function topic(id, version) {
  T ??= await data.topics();
  const match = /^\d+$/.test(id) ? Number(id) : T.topics.find(x => x.slug === id)?.id;
  if (match == null) throw Error('Topic not found');
  const t = await topicDetails(match), me = T.topics.find(x => x.id === t.id);
  const newsletterAvailable = document.querySelector('meta[name="hn-newsletter"]')?.content === 'cloudflare';
  if (version !== routeVersion) return;
  if (location.pathname !== `/topic/${t.slug}/`) history.replaceState(null, '', `/topic/${t.slug}/`);
  updateMetadata(`${t.name} · HN Atlas`, t.description, `/topic/${t.slug}/`);
  const related = T.edges.filter(e => e.a === t.id || e.b === t.id).map(e => T.topics.find(x => x.id === (e.a === t.id ? e.b : e.a))).filter(Boolean);
  // Keep the current page intact until the next page's visible sections are ready.
  await Promise.allSettled([
    data.timelineZoom(t.id),
    data.stories(t.id, new URLSearchParams('sort=top&days=30&year=0&offset=0&limit=10')),
  ]);
  if (version !== routeVersion) return;
  document.body.classList.remove('home-route', 'connections-route');
  $("#app").innerHTML = `<div class="page">
    <a href="/#/topics" class="meta" style="align-self: start">← All topics</a>
    <div class="hero topic-hero"><div><h1>${esc(t.name)}</h1>
    <p class="topic-description">${esc(t.description)}</p><p class="topic-stats">${t.size.toLocaleString()} stories <span>·</span> ${me.last_7d} in 7 days <span>·</span> Updated ${new Date(t.as_of*1000).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</p></div></div>
    <nav class="topic-nav" aria-label="On this topic page"><button type="button" data-section="topic-recent">01 <span>Now</span></button><button type="button" data-section="topic-history">02 <span>Timeline</span></button><button type="button" data-section="topic-activity">03 <span>Activity</span></button><button type="button" data-section="topic-archive">04 <span>Explore</span></button>${newsletterAvailable ? '<a class="topic-follow-link" href="#topic-updates">Weekly selection ↗</a>' : ''}</nav>
    <section id="topic-recent" class="recent-stories" tabindex="-1"><p class="eyebrow">01 / CATCH UP</p><h2>The conversation now</h2><p class="section-intro">Popular recent stories, shown newest first.</p>${t.trending.slice(0,5).sort((a,b)=>b.time-a.time||b.id-a.id).map(post).join("") || '<p class="meta">No recent stories.</p>'}</section>
    ${newsletterAvailable ? `<details class="topic-follow" id="topic-updates"><summary><span><strong>Keep up with this topic</strong><small>A few highlights, once a week.</small></span><span class="topic-follow-action">Get the weekly email <span aria-hidden="true">＋</span></span></summary><div class="topic-follow-panel"><p>Weekly highlights from ${esc(t.name)}, Sundays at 18:00 Stockholm time.</p><form id="follow-form"><input name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required aria-label="Email address"><label class="contact-check" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit">Send me weekly highlights</button></form><small>One email a week about this topic. Unsubscribe any time.</small><small id="follow-status" role="status" aria-live="polite"></small></div></details>` : ''}
    <section id="topic-history" class="topic-history" aria-label="Topic timeline" tabindex="-1"></section>
    <section id="topic-activity" class="activity" tabindex="-1" aria-labelledby="activity-title"><div class="activity-content"><div class="chart-heading"><div><h2 id="activity-title">The pace of conversation</h2><p id="chart-readout" aria-live="polite">Posts per month</p></div><div class="sort" aria-label="Activity period"><button data-range="12">1 year</button><button data-range="24">2 years</button><button data-range="0">All</button></div></div><svg id="activity-chart" role="group" aria-label="Monthly posts; select a bar for its count"></svg><p class="chart-note">Posts per month · first and latest months may be partial. Hover, tap, or focus a bar for its count.</p></div></section>
    <section id="topic-archive" class="topic-archive" tabindex="-1" aria-label="Browse topic stories"><p class="eyebrow">04 / GO DEEPER</p><h2>Follow your curiosity</h2><p class="section-intro">Find a particular story, revisit a year, or see what resonated.</p>
      <form id="story-search" class="browse-tools">
        <input name="q" type="search" maxlength="200" placeholder="Search titles or websites…" aria-label="Search stories">
        <select name="sort" aria-label="Sort stories"><option value="newest">Newest</option><option value="top" selected>Highest rated</option><option value="discussed">Most discussed</option></select>
        <select name="days" aria-label="Story period"><option value="0">All time</option><option value="7">Last week</option><option value="30" selected>Last month</option><option value="365">Last year</option></select>
        <select name="year" aria-label="Archive year"><option value="0">Any year</option>${[...new Set(t.monthly.map(m=>m.month?.slice(0,4)).filter(Boolean))].sort().reverse().map(y=>`<option value="${y}">${y}</option>`).join('')}</select>
        <button type="submit">Search</button><button type="button" id="reset-search" hidden>Clear filters</button>
      </form>
      <p id="archive-context" class="meta"></p>
      <div id="story-results"></div><p id="story-status" class="meta" role="status"></p>
      <button id="more-stories" type="button" hidden>Load more stories</button>
    </section>


    <footer class="topic-footer">${related.length ? `<div><p class="eyebrow">KEEP EXPLORING</p><h2>A little further afield</h2><div class="related-cards">${related.slice(0,4).map(r=>`<a href="/topic/${r.slug}/"><strong>${esc(r.name)} <span>↗</span></strong><p>${esc(r.description)}</p></a>`).join('')}</div></div>` : ''}
</footer>
  </div>`;
  window.scrollTo(0,0);
  document.querySelectorAll('.topic-follow-link').forEach(link => link.onclick=()=>{ $('#topic-updates').open=true; });
  const jump = target => {
    const section = document.getElementById(target);
    section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',block:'start'});
    section.focus({preventScroll:true});
  };
  document.querySelectorAll('[data-section]').forEach(button=>button.onclick=()=>jump(button.dataset.section));
  const storyForm = $("#story-search"), results = $("#story-results"), more = $("#more-stories"), storyStatus = $("#story-status");
  let storyOffset = 0, storyQuery = new URLSearchParams(), storyRequest = 0;
  async function loadStories(reset = false) {
    const request = ++storyRequest;
    if (reset) { storyOffset = 0; storyQuery = new URLSearchParams(new FormData(storyForm)); }
    more.disabled = true;
    results.setAttribute("aria-busy", "true");
    const params = new URLSearchParams(storyQuery); params.set("offset", storyOffset); params.set("limit",10);
    const year = storyQuery.get('year'), days = Number(storyQuery.get('days'));
    const period = year && year !== '0' ? year : days ? `the last ${days} days` : 'all years';
    $('#archive-context').textContent = `${{top:'Highest rated',newest:'Newest',discussed:'Most discussed'}[storyQuery.get('sort')]} · ${period}${storyQuery.get('q') ? ` · “${storyQuery.get('q')}”` : ''}`;
    $('#reset-search').hidden = !(storyQuery.get('q') || year !== '0' || days !== 30 || storyQuery.get('sort') !== 'top');
    try {
      const page = await data.stories(t.id, params);
      if (request !== storyRequest || version !== routeVersion) return;
      if (reset) results.innerHTML = "";
      results.insertAdjacentHTML("beforeend", page.posts.map(post).join(""));
      storyOffset = page.next_offset;
      more.hidden = storyOffset === null;
      storyStatus.textContent = results.children.length ? `${results.children.length} stories shown.` : "No stories match. Try another search or period.";
    } catch {
      if (request !== storyRequest || version !== routeVersion) return;
      storyStatus.textContent = "Could not load stories. Try again.";
      more.hidden = false;
    } finally { if (request === storyRequest) { more.disabled = false; results.removeAttribute("aria-busy"); } }
  }
  storyForm.onsubmit = e => { e.preventDefault(); loadStories(true); };
  storyForm.onchange = e => {
    if (e.target.name === 'year' && e.target.value !== '0') storyForm.elements.days.value = '0';
    if (e.target.name === 'days') storyForm.elements.year.value = '0';
    if (e.target.tagName === 'SELECT') loadStories(true);
  };
  $('#reset-search').onclick = () => { storyForm.reset(); loadStories(true); };
  loadHistory(t.id, version, year => {
    storyForm.reset(); storyForm.elements.year.value = year; storyForm.elements.days.value = '0';
    loadStories(true); jump('topic-archive');
  },()=>jump('topic-recent'));
  more.onclick = () => loadStories();
  loadStories(true);
  if (window.d3 && t.monthly?.length) {
    const parse=d3.utcParse("%Y-%m"), format=d3.utcFormat("%B %Y");
    const months=new Map(t.monthly.filter(m=>m.month).map(m=>[m.month,m.posts]));
    const dates=[...months.keys()].sort();
    const lastMonth=d3.utcMonth.floor(new Date(t.as_of*1000));
    const all=d3.utcMonth.range(parse(dates[0]),d3.utcMonth.offset(lastMonth,1))
      .map(date=>({date,posts:months.get(d3.utcFormat("%Y-%m")(date)) || 0}));
    let currentRange=0;
    const draw=range=>{
      currentRange=range;
      const data=range ? all.slice(-range) : all, W=Math.max(240,$("#activity-chart").clientWidth),H=$("#activity-chart").clientHeight;
      const chart=d3.select("#activity-chart").attr("viewBox",`0 0 ${W} ${H}`);
      chart.selectAll("*").remove();
      const x=d3.scaleBand(data.map(m=>+m.date),[48,W-32]).padding(.22);
      const y=d3.scaleLinear([0,d3.max(data,m=>m.posts)||1],[H-34,26]).nice();
      chart.append("g").attr("class","chart-grid").attr("transform","translate(48,0)")
        .call(d3.axisLeft(y).ticks(4).tickSize(-(W-62)).tickFormat(v=>Number.isInteger(v)?d3.format(",")(v):"")).call(g=>g.select(".domain").remove());
      const tickCount=Math.min(data.length,W<500 ? 3 : 5);
      const ticks=Array.from({length:tickCount},(_,i)=>+data[Math.round(i*(data.length-1)/Math.max(1,tickCount-1))].date);
      chart.append("g").attr("transform",`translate(0,${H-34})`)
        .call(d3.axisBottom(x).tickValues(ticks).tickFormat(d=>d3.utcFormat("%b %Y")(new Date(d))).tickSize(0).tickPadding(12))
        .call(g=>g.select(".domain").remove());
      chart.append("text").attr("x",48).attr("y",12).text("Posts");
      const bars=chart.append("g").selectAll("rect").data(data).join("rect").attr("class","chart-bar")
        .attr("x",m=>x(+m.date)).attr("y",m=>y(m.posts)).attr("width",x.bandwidth()).attr("height",m=>H-34-y(m.posts))
        .attr("rx",3);
      const hits=chart.append("g").selectAll("rect").data(data).join("rect").attr("class","chart-hit")
        .attr("x",m=>x(+m.date)).attr("y",24).attr("width",x.bandwidth()).attr("height",H-58)
        .attr("tabindex",0).attr("role","button")
        .attr("aria-label",m=>`${format(m.date)}: ${m.posts.toLocaleString()} posts`);
      const select=m=>{ bars.classed("selected",d=>d===m); $("#chart-readout").textContent=`${format(m.date)} · ${m.posts.toLocaleString()} posts`; };
      hits.on("pointerenter focus click",(_,m)=>select(m)).on("keydown",(e,m)=>{if(e.key==="Enter" || e.key===" "){e.preventDefault();select(m);}});
      select(data.at(-1));
      document.querySelectorAll("[data-range]").forEach(b=>{b.classList.toggle("on",+b.dataset.range===range); b.setAttribute("aria-pressed",+b.dataset.range===range);});
    };
    document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>draw(+b.dataset.range));
    draw(currentRange);
    let previousWidth=$("#activity-chart").clientWidth;
    activityResizeObserver=new ResizeObserver(()=>{
      const width=$("#activity-chart")?.clientWidth;
      if(version===routeVersion && width && width!==previousWidth){previousWidth=width;draw(currentRange);}
    });
    activityResizeObserver.observe($("#activity-chart"));
  } else {
    $(".activity").hidden=true;
    document.querySelectorAll("[data-range]").forEach(b=>b.disabled=true);
  }
  if ($("#follow-form")) $("#follow-form").onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const form = e.target, button = form.querySelector('button');
    if (button.disabled) return;
    button.disabled = true;
    const status = $("#follow-status"); status.textContent = "Saving…";
    try {
      const r = await fetch("/api/newsletter/subscribe", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({...data, topic:t.id})});
      const result = await r.json();
      if (!r.ok) throw Error(result.detail || "Could not subscribe");
      status.textContent = `You’ll receive weekly highlights from ${t.name}.`;
      form.reset();
    } catch (err) { status.textContent = "Could not save your email. Please try again. " + err.message; }
    finally { button.disabled = false; }
  };

}

// ---------- zoomable topic history ----------
async function loadHistory(id, version, onYear, onRecent) {
  const host = $('#topic-history');
  try {
    const source = await data.timelineZoom(id);
    const history = source?.levels ? {...source, levels:Object.fromEntries(
      Object.entries(source.levels).map(([key,periods])=>[key,[...periods].reverse()]))} : source;
    if (version !== routeVersion || !host.isConnected) return;
    if (!history?.levels) throw Error('Timeline data unavailable');
    if (!history.levels.year.length) {
      host.innerHTML = '<h2>Timeline</h2><p class="meta">No stories yet. This topic’s history will appear here.</p>';
      return;
    }
    const scales = [
      {key:'year', limit:2, name:'Big picture', hint:'Up to 2 stories per year'},
      {key:'year', limit:5, name:'Year by year', hint:'Up to 5 stories per year'},
      {key:'month', limit:3, name:'Month by month', hint:'Up to 3 stories per month'},
      {key:'week', limit:3, name:'Week by week', hint:'Up to 3 stories per week'}
    ];
    const defaultLevel = 1;
    let level = defaultLevel, frame = 0;
    const yearOf = stamp => new Date(stamp*1000).getUTCFullYear();
    const years = history.levels.year.map(p=>yearOf(p.start));
    const label = (p, key) => new Date(p.start*1000).toLocaleDateString(undefined,
      {timeZone:'UTC',year:'numeric',...(key==='year' ? {} : {month:'short'}),...(key==='week' ? {day:'numeric'} : {})});
    host.innerHTML = `<div class="history-heading"><div><p class="eyebrow">02 / EXPLORE THROUGH TIME</p><h2>Timeline</h2></div><span class="history-span">${years[0]} — ${years.at(-1)}</span></div>
      <p class="section-intro">Start with the latest. Scroll back through time, or zoom in for more.</p>
      <div class="zt-shell">
        <div class="zt-toolbar"><div class="zt-scale"><strong id="zt-scale-name">${scales[defaultLevel].name}</strong><span id="zt-scale-hint">${scales[defaultLevel].hint}</span></div><div class="zt-zoom"><button type="button" id="zt-out" aria-label="Zoom out">−</button><input id="zt-zoom" type="range" min="0" max="3" step="1" value="${defaultLevel}" aria-label="Timeline detail" aria-valuetext="${scales[defaultLevel].name}"><button type="button" id="zt-in" aria-label="Zoom in">+</button></div><label class="zt-jump"><span>Jump to</span><select id="zt-year" aria-label="Jump to year">${years.map(y=>`<option value="${y}">${y}</option>`).join('')}</select></label></div>
        <div class="zt-view" id="zt-view" tabindex="0" role="region" aria-label="Scrollable news timeline. Use the zoom controls to reveal more detail."><div id="zt-periods"></div></div>
        <div class="zt-footer"><span id="zt-position" role="status"></span><span>Scroll through time <span aria-hidden="true">↕</span></span><button type="button" id="zt-reset">Reset view</button></div>
      </div>
      <div class="zt-below"><button type="button" id="zt-archive">Explore this year’s archive ↗</button><button type="button" id="zt-latest">Catch up with the latest →</button></div>
      <details class="timeline-method"><summary>About this timeline</summary><p>Start with up to five highlights per year. Zoom out for two highlights, or zoom in to explore months and weeks. Picks are ranked within each period by HN points, with comments breaking ties, and displayed newest first by submission date. Duplicate links within a period are skipped. There is no minimum point score; quiet periods stay visible. HN attention is a discovery signal, not a measure of lasting impact. The timeline covers our available archive; first and last periods may be incomplete.</p></details>`;
    const viewport = host.querySelector('#zt-view'), periods = host.querySelector('#zt-periods');
    const slider = host.querySelector('#zt-zoom'), jump = host.querySelector('#zt-year');
    const position = host.querySelector('#zt-position');
    const visiblePeriod = () => {
      const top = viewport.getBoundingClientRect().top + 24;
      const sections=[...periods.querySelectorAll('.zt-period')];
      return sections.find(el=>el.getBoundingClientRect().bottom>top) || sections.at(-1);
    };
    const updatePosition = () => {
      const el = visiblePeriod();
      if (!el) return;
      const p = history.levels[scales[level].key][Number(el.dataset.index)];
      jump.value = String(yearOf(Math.max(history.start,p.start)));
      position.textContent = (scales[level].key==='week' ? 'Week of ' : '') + label(p,scales[level].key);
    };
    // Keep a visible article fixed when it survives the zoom; otherwise keep its period.
    const capture = () => {
      const box = viewport.getBoundingClientRect();
      const article = [...periods.querySelectorAll('[data-story]')].find(el=>{
        const rect = el.getBoundingClientRect();
        return rect.bottom>box.top+70 && rect.top<box.bottom;
      });
      const el = article || visiblePeriod();
      return {time:Number(el.dataset.time), story:article?.dataset.story,
              offset:el.getBoundingClientRect().top-box.top};
    };
    const restore = anchor => {
      const article = anchor.story && periods.querySelector(`[data-story="${anchor.story}"]`);
      const buckets = history.levels[scales[level].key];
      let index = buckets.findIndex(p=>p.start<=anchor.time && p.end>anchor.time);
      if (index<0) index=anchor.time<buckets.at(-1).start ? buckets.length-1 : 0;
      const el = article || periods.children[index];
      viewport.scrollTop += el.getBoundingClientRect().top-viewport.getBoundingClientRect().top-(article ? anchor.offset : 12);
      updatePosition();
    };
    const render = anchor => {
      const scale = scales[level];
      viewport.dataset.level = level;
      periods.innerHTML = history.levels[scale.key].map((p,i)=>{
        const picks = p.posts.slice(0,scale.limit).sort((a,b)=>b.time-a.time||b.id-a.id);
        const title = label(p,scale.key);
        return `<section class="zt-period" data-index="${i}" data-time="${p.end-1}"><div class="zt-date"><span class="zt-dot"></span>${scale.key==='week' ? '<small>Week of</small>' : ''}<button type="button" data-drill="${p.end-1}" ${level===3 ? 'disabled' : ''} aria-label="Zoom into ${esc(title)}">${esc(title)}${level<3 ? ' <span>+</span>' : ''}</button><small>${p.count.toLocaleString()} stories</small></div><div class="zt-stories">${picks.map(p=>`<article class="zt-story" data-story="${p.id}" data-time="${p.time}"><time datetime="${new Date(p.time*1000).toISOString()}">${new Date(p.time*1000).toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'})}</time><h3><a href="${esc(safeUrl(p.url)||hn(p.id))}" target="_blank" rel="noopener">${esc(p.title)} <span>↗</span></a></h3><div class="zt-meta"><span>${esc(domain(p.url)||'Hacker News')}</span><a href="${hn(p.id)}" target="_blank" rel="noopener">${p.score.toLocaleString()} points · ${p.descendants||0} comments</a></div></article>`).join('') || `<p class="zt-quiet">No stories in this period.</p>`}</div></section>`;
      }).join('') + '<div class="zt-end">You’ve reached the beginning of this archive.</div>';
      periods.querySelector('.zt-period:last-of-type').style.minHeight=`${viewport.clientHeight}px`;
      host.querySelector('#zt-scale-name').textContent=scale.name;
      host.querySelector('#zt-scale-hint').textContent=scale.hint;
      slider.value=level;
      slider.setAttribute('aria-valuetext',scale.name);
      host.querySelector('#zt-out').disabled=level===0;
      host.querySelector('#zt-in').disabled=level===3;
      if(anchor) restore(anchor); else viewport.scrollTop=0;
      updatePosition();
    };
    const zoomTo = (next, anchor=capture()) => {
      const bounded=Math.max(0,Math.min(3,next));
      if (bounded===level) return;
      level=bounded; render(anchor);
    };
    host.querySelector('#zt-out').onclick=()=>zoomTo(level-1);
    host.querySelector('#zt-in').onclick=()=>zoomTo(level+1);
    slider.oninput=()=>zoomTo(Number(slider.value));
    jump.onchange=()=>restore({time:Math.max(history.start,Math.min(history.as_of,Date.UTC(Number(jump.value)+1,0,1)/1000-1))});
    periods.onclick=e=>{
      const button=e.target.closest('[data-drill]');
      if (!button || level===3) return;
      zoomTo(level+1,{time:Number(button.dataset.drill)});
      viewport.focus({preventScroll:true});
    };
    viewport.onscroll=()=>{
      if(frame) return;
      frame=requestAnimationFrame(()=>{frame=0;if(host.isConnected)updatePosition();});
    };
    host.querySelector('#zt-reset').onclick=()=>{level=defaultLevel;render();};
    host.querySelector('#zt-archive').onclick=()=>onYear(jump.value);
    host.querySelector('#zt-latest').onclick=onRecent;
    render();
  } catch {
    if (version !== routeVersion || !host.isConnected) return;
    host.innerHTML='<h2>Timeline</h2><p class="meta">The history could not load.</p><button type="button" id="history-retry">Try again</button>';
    host.querySelector('#history-retry').onclick=()=>{host.innerHTML='';loadHistory(id,version,onYear,onRecent);};
  }
}


// Feedback stays available across topic navigation; a native dialog handles focus and Escape.
const siteFooter = $('.site-footer');
const feedbackDialog = $('#feedback-dialog'), feedbackForm = $('#feedback-form');
const feedbackStatus = $('#feedback-status'), feedbackOpen = $('#feedback-open');
let feedbackId = null, feedbackPage = '#/', feedbackSent = false;
const feedbackAvailable = document.querySelector('meta[name="hn-feedback"]')?.content === 'cloudflare';
feedbackForm.querySelector('button[type="submit"]').disabled = !feedbackAvailable;
feedbackOpen.onclick = () => {
  if (feedbackSent) { feedbackForm.reset(); feedbackStatus.textContent = ''; feedbackForm.hidden = false; feedbackSent = false; }
  feedbackId ??= crypto.randomUUID();
  feedbackPage = location.pathname + location.search + location.hash;
  if (!feedbackAvailable) feedbackStatus.textContent = 'Feedback sending is available on the published site. This local preview does not send messages.';
  feedbackDialog.showModal();
};
$('#feedback-close').onclick = () => feedbackDialog.close();
feedbackForm.addEventListener('input', () => { feedbackId = crypto.randomUUID(); });
feedbackForm.onsubmit = async event => {
  event.preventDefault();
  if (!feedbackAvailable) return;
  const button = feedbackForm.querySelector('button[type="submit"]');
  if (button.disabled) return;
  button.disabled = true;
  feedbackStatus.textContent = 'Sending…';
  const fields = Object.fromEntries(new FormData(feedbackForm));
  const controls = [...feedbackForm.elements];
  controls.forEach(control => control.disabled = true);
  try {
    const response = await fetch('/api/feedback', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...fields, id:feedbackId, page:feedbackPage}),
      signal:AbortSignal.timeout(15000)
    });
    const result = await response.json();
    if (!response.ok) throw Error(result.detail || 'Please try again.');
    feedbackStatus.textContent = 'Thanks! Your feedback has been saved. — Andrea';
    feedbackForm.hidden = true;
    feedbackSent = true;
    feedbackId = null;
    $('#feedback-close').focus();
  } catch (error) {
    feedbackStatus.textContent = error.name === 'TimeoutError' ? 'The connection timed out. Please try again.' : 'Could not send. ' + error.message;
  } finally { controls.forEach(control => control.disabled = false); }
};

// ---------- wiring ----------
const tip = $("#tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest("[data-tip]");
  tip.hidden = !t;
  if (t) { tip.textContent = t.dataset.tip; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = Math.min(e.clientY + 12, innerHeight - tip.offsetHeight - 8) + "px"; }
});
function updateMetadata(title = 'HN Atlas', description = 'Explore Hacker News by topic: discover stories, follow trends, and browse the archive.', path = '/') {
  document.title = title;
  const url = `https://hackeratlas.com${path}`;
  for (const [key, value] of Object.entries({'description':description, 'og:title':title, 'og:description':description, 'og:url':url, 'og:type':'website', 'twitter:card':'summary', 'twitter:title':title, 'twitter:description':description})) {
    const attr = key.startsWith('og:') ? 'property' : 'name';
    let tag = document.querySelector(`meta[${attr}="${key}"]`);
    if (!tag) { tag = document.createElement('meta'); tag.setAttribute(attr, key); document.head.append(tag); }
    tag.content = value || '';
  }
  let canonical = document.querySelector('link[rel="canonical"]');
  if (!canonical) { canonical = document.createElement('link'); canonical.rel = 'canonical'; document.head.append(canonical); }
  canonical.href = url;
}
function route() {
  const oldTopic = location.hash.match(/^#\/topic\/(\d+)\/?$/);
  if (oldTopic) history.replaceState(null, '', `/topic/${oldTopic[1]}/`);
  if (/^#\/timeline(?:\?|$)/.test(location.hash)) {
    const legacy = new URLSearchParams(location.hash.split('?')[1] || '');
    history.replaceState(null, '', /^\d+$/.test(legacy.get('topic') || '') ? `/topic/${legacy.get('topic')}/` : '/');
  }
  const version = ++routeVersion;
  const m = location.pathname.match(/^\/topic\/([a-z0-9-]+)\/?$/);
  const isTopics=location.hash === "#/topics";
  const isTrends=location.hash === "#/trends";
  tip.hidden=true;
  const scrollSection=behavior=>$(isTopics ? '#browse-section' : isTrends ? '#trends-section' : '#map-section')?.scrollIntoView({behavior,block:'start'});
  $('#topics').classList.toggle('on',!!m || isTopics);
  $('#trends').classList.toggle('on',!m && isTrends);
  $('#connections').classList.toggle('on',!m && !isTopics && !isTrends);
  for (const [link, current] of [['#topics', !!m || isTopics], ['#trends', !m && isTrends], ['#connections', !m && !isTopics && !isTrends]]) {
    if (current) $(link).setAttribute('aria-current', 'page');
    else $(link).removeAttribute('aria-current');
  }
  if (!m && $('#map-section') && mapResizeObserver) {
    scrollSection(reduceMotion() ? 'instant' : 'smooth');
    return;
  }
  activityResizeObserver?.disconnect();
  mapResizeObserver?.disconnect();
  if (!m) updateMetadata();
  (m ? topic(m[1], version) : connections(version)).catch(e => {
    if (version === routeVersion) $("#app").innerHTML = `<p class="loading" role="alert">Could not load: ${esc(e.message)}</p>`;
  }).then(() => {
    if (version !== routeVersion) return;
    ($(".connections-page") || $(".page") || $("#app")).append(siteFooter);
    siteFooter.hidden = false;
    if(!m)scrollSection('instant');
  });
}
// Keep ordinary navigation in the app; modified clicks retain native browser behavior.
document.addEventListener('click', event => {
  const link = event.target.closest('a[href]');
  if (!link || event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || link.target || link.hasAttribute('download')) return;
  const url = new URL(link.href, location.href);
  if (url.origin !== location.origin || !(url.pathname === '/' || /^\/topic\/[a-z0-9-]+\/?$/.test(url.pathname))) return;
  if (url.hash && !['#/', '#/topics', '#/trends'].includes(url.hash)) return;
  event.preventDefault();
  if (url.href !== location.href) history.pushState(null, '', url.pathname + url.search + url.hash);
  route();
});
addEventListener("popstate", route);
addEventListener("hashchange", route);
route();
</script>
