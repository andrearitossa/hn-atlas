name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q . -x "data|dist|.venv|.git"
      - run: node --check data.js
      - run: node --check topic.js
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: python tests/build_browser_fixture.py .wrangler/browser-fixture
      - run: npm run test:usability
        env:
          SITE_BUNDLE: .wrangler/browser-fixture
      - uses: actions/upload-artifact@v6
        if: failure() && hashFiles('test-results/**') != ''
        with:
          name: browser-failures
          path: test-results/
