name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile catalog.py core.py daily.py embed.py hn_import_dump.py hn_sync.py jobs.py llm.py pages.py production.py publish.py quality.py server.py topics.py scripts/*.py
      - run: node --check data.js
      - run: node --test tests/newsletter.test.mjs tests/feedback.test.mjs
